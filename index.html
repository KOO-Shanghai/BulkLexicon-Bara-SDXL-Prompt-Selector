<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Bara Prompt Generator</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="page page-active" id="page-keywords" aria-label="生成">
        <header class="topbar">
          <div>
            <h1>生成</h1>
            <p id="library-count">读取词库中</p>
          </div>
        </header>

        <section class="keyword-tab-panel active" id="keyword-tab-selector">
          <section class="keyword-workbench">
            <aside class="category-rail" aria-label="关键词分类" id="category-list"></aside>
            <section class="keyword-panel">
              <div class="subcategory-tabs" id="subcategory-tabs"></div>
              <div class="keyword-grid" id="keyword-grid"></div>
            </section>
          </section>

          <section class="custom-prompt-panel" aria-label="自定义添加关键词">
            <textarea id="custom-prompt" spellcheck="false" placeholder="自定义添加关键词，用英文逗号分隔"></textarea>
          </section>
        </section>

        <section class="keyword-tab-panel" id="keyword-tab-defaults">
          <div class="default-prompt-panel">
            <article class="prompt-box">
              <div class="prompt-box-head">
                <strong>默认正面提示词</strong>
                <button class="ghost-button" data-copy-default="positive" type="button">复制</button>
              </div>
              <textarea id="default-positive-prompt" spellcheck="false" placeholder="这里填写每次生成都会加入的正面提示词"></textarea>
            </article>
            <article class="prompt-box">
              <div class="prompt-box-head">
                <strong>默认负面提示词</strong>
                <button class="ghost-button" data-copy-default="negative" type="button">复制</button>
              </div>
              <textarea id="default-negative-prompt" spellcheck="false" placeholder="这里填写每次生成都会加入的负面提示词"></textarea>
            </article>
          </div>
        </section>
      </section>

      <section class="page" id="page-history" aria-label="图像历史">
        <header class="topbar simple">
          <div>
            <h1>图像历史</h1>
            <p id="history-count">暂无图片</p>
          </div>
        </header>
        <div class="history-panel">
          <div class="history-empty" id="history-empty">
            <h2>还没有生成结果</h2>
            <p>点「生成」后，完成的图片会出现在这里。</p>
          </div>
          <div class="history-grid" id="history-grid"></div>
        </div>
      </section>

      <section class="page" id="page-settings" aria-label="设置">
        <header class="topbar simple">
          <div>
            <h1>设置</h1>
            <p>模型、LoRA、尺寸和 ComfyUI 节点。</p>
          </div>
        </header>
        <div class="settings-grid">
          <section class="settings-tab-panel active" id="settings-tab-model">
            <div class="model-settings-grid">
              <section class="settings-card">
                <div class="settings-section-head">
                  <strong>模型选择</strong>
                </div>
              <label class="setting-field">
                <span>模型</span>
                <select id="model-select">
                  <option value="">默认 wai</option>
                </select>
              </label>
              </section>
              <section class="settings-card">
                <div class="settings-section-head">
                  <strong>LoRA 1</strong>
                </div>
                  <label class="setting-field">
                    <span>LoRA 模型</span>
                    <select id="lora-1-select">
                      <option value="">默认 flat_style</option>
                    </select>
                  </label>
                  <label class="setting-field">
                    <span>强度</span>
                    <input id="lora-1-strength" type="number" min="-2" max="2" step="0.05" placeholder="0.3" />
                  </label>
              </section>
              <section class="settings-card">
                <div class="settings-section-head">
                  <strong>LoRA 2</strong>
                </div>
                  <label class="setting-field">
                    <span>LoRA 模型</span>
                    <select id="lora-2-select">
                    <option value="">默认 semi_realistic</option>
                    </select>
                  </label>
                  <label class="setting-field">
                    <span>强度</span>
                    <input id="lora-2-strength" type="number" min="-2" max="2" step="0.05" placeholder="0.7" />
                  </label>
              </section>
            </div>
            <section class="settings-card">
              <div class="settings-section-head">
                <strong>图片尺寸</strong>
              </div>
              <div class="size-preset-grid" id="size-preset-grid" role="radiogroup" aria-label="常用尺寸"></div>
              <div class="setting-row">
                <label class="setting-field">
                  <span>宽</span>
                  <input id="image-width" type="number" min="64" max="4096" step="8" placeholder="1024" />
                </label>
                <label class="setting-field">
                  <span>高</span>
                  <input id="image-height" type="number" min="64" max="4096" step="8" placeholder="1024" />
                </label>
              </div>
            </section>
          </section>

          <section class="settings-tab-panel" id="settings-tab-nodes">
          <section class="settings-card">
            <div class="settings-section-head">
              <strong>节点与链接</strong>
              <div class="settings-actions">
                <button class="ghost-button" id="load-default-workflow" type="button">载入默认</button>
                <button class="ghost-button" id="test-comfy" type="button">测试连接</button>
                <button class="ghost-button" id="refresh-comfy-resources" type="button">刷新模型/LoRA</button>
              </div>
            </div>
            <label class="setting-field">
              <span>ComfyUI 地址</span>
              <input id="comfy-url" type="url" value="http://192.168.101.43:8000" spellcheck="false" />
            </label>
          </section>
          <section class="settings-card">
            <div class="settings-section-head">
              <strong>提示词与基础节点</strong>
            </div>
            <div class="setting-row">
              <label class="setting-field">
                <span>正面提示词节点 ID</span>
                <input id="positive-node-id" type="text" placeholder="例如 6" spellcheck="false" />
              </label>
              <label class="setting-field">
                <span>负面提示词节点 ID</span>
                <input id="negative-node-id" type="text" placeholder="例如 7" spellcheck="false" />
              </label>
            </div>
            <div class="setting-row">
              <label class="setting-field">
                <span>模型节点 ID</span>
                <input id="model-node-id" type="text" placeholder="例如 4" spellcheck="false" />
              </label>
              <label class="setting-field">
                <span>尺寸节点 ID</span>
                <input id="size-node-id" type="text" placeholder="例如 5" spellcheck="false" />
              </label>
            </div>
          </section>
          <section class="settings-card">
            <div class="settings-section-head">
              <strong>LoRA 节点</strong>
            </div>
            <div class="lora-settings">
              <section class="lora-card">
                <strong>LoRA 1</strong>
                <label class="setting-field">
                  <span>节点 ID</span>
                  <input id="lora-1-node-id" type="text" placeholder="例如 11" spellcheck="false" />
                </label>
              </section>
              <section class="lora-card">
                <strong>LoRA 2</strong>
                <label class="setting-field">
                  <span>节点 ID</span>
                  <input id="lora-2-node-id" type="text" placeholder="例如 12" spellcheck="false" />
                </label>
              </section>
            </div>
          </section>
          <section class="settings-card">
            <label class="setting-field workflow-field">
              <span>Workflow API JSON</span>
              <textarea id="workflow-json" spellcheck="false" placeholder="粘贴从 ComfyUI 导出的 API workflow JSON"></textarea>
            </label>
            <p class="status-line" id="comfy-status">尚未测试连接</p>
          </section>
          </section>
        </div>
      </section>
    </main>

    <nav class="side-nav" aria-label="主菜单">
      <button class="nav-button active" data-page="keywords" type="button">
        <span class="nav-icon">🕝</span>
        <span>生成</span>
      </button>
      <button class="nav-button" data-page="history" type="button">
        <span class="nav-icon">📝</span>
        <span>历史</span>
      </button>
      <button class="nav-button" data-page="settings" type="button">
        <span class="nav-icon">⚙️</span>
        <span>设置</span>
      </button>
    </nav>

    <aside class="keyword-side-tabs" role="tablist" aria-label="生成功能">
      <button class="mode-button active" data-keyword-tab="selector" type="button">
        <span>选择</span>
        <span>提示词</span>
      </button>
      <button class="mode-button" data-keyword-tab="defaults" type="button">
        <span>默认</span>
        <span>正负面</span>
      </button>
    </aside>

    <aside class="settings-side-tabs" role="tablist" aria-label="设置功能">
      <button class="mode-button active" data-settings-tab="model" type="button">
        <span>模型</span>
        <span>设置</span>
      </button>
      <button class="mode-button" data-settings-tab="nodes" type="button">
        <span>节点</span>
        <span>链接</span>
      </button>
    </aside>

    <aside class="action-side-tabs" aria-label="生成操作">
      <div class="action-group queue-group">
        <div class="progress-bar" id="queue-progress" style="--progress: 0">
          <span></span>
        </div>
        <span id="queue-pending" class="queue-pending">待生成 0</span>
        <button class="ghost-button queue-button" id="stop-all" type="button" disabled>停止所有</button>
        <button class="ghost-button queue-button" id="clear-queue" type="button" disabled>停止后续</button>
      </div>
      <div class="action-group batch-control" aria-label="批量生成数量">
        <div class="batch-buttons">
          <button class="ghost-button icon-button" id="increase-batch" type="button">+</button>
          <button class="ghost-button icon-button" id="decrease-batch" type="button">-</button>
        </div>
        <button class="primary-button" id="generate-image" type="button">生成1</button>
      </div>
      <div class="action-group keyword-action-group">
        <button class="ghost-button" id="copy-selected" type="button">复制关键词</button>
      </div>
      <div class="action-group keyword-action-group">
        <button class="ghost-button" id="clear-selected" type="button">清空关键词</button>
      </div>
    </aside>

    <dialog class="image-dialog" id="image-dialog">
      <div class="image-dialog-shell">
        <div class="image-dialog-media">
          <img id="image-dialog-img" alt="" />
        </div>
        <aside class="image-dialog-details">
          <div class="settings-section-head">
            <strong id="image-dialog-title">生成详情</strong>
            <button class="ghost-button" id="close-image-dialog" type="button">关闭</button>
          </div>
          <a class="primary-button save-link" id="save-image-link" href="#" download>保存</a>
          <dl class="image-meta">
            <dt>时间</dt>
            <dd id="image-dialog-time"></dd>
            <dt>Prompt ID</dt>
            <dd id="image-dialog-prompt-id"></dd>
            <dt>正面提示词</dt>
            <dd id="image-dialog-positive"></dd>
            <dt>负面提示词</dt>
            <dd id="image-dialog-negative"></dd>
          </dl>
        </aside>
      </div>
    </dialog>

    <script type="module" src="./app.js"></script>
  </body>
</html>
