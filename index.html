<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>关键词选择器</title>
  <style>
    :root {
      --primary: #000;
      --light-bg: #f0f0f0;
      --gray: #999;
      --sidebar-width: 160px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background-color: var(--light-bg);
      padding-bottom: 110px;
      overflow-x: hidden;
    }

    header {
      background: transparent;
      padding: 0;
      margin-top: 10px;
      text-align: center;
      font-size: 42px;
      font-weight: 700;
      font-family: 'Dancing Script', cursive;
      color: #111;
    }

    /* ── Main content ── */
    #main-content {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 32px 0 32px;
    }

    /* One section per main category */
    .cat-section {
      margin-bottom: 40px;
    }

    .cat-title {
      font-size: 12px;
      font-weight: 600;
      color: #bbb;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 0 0 16px 0;
      text-align: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #ddd;
      margin-bottom: 24px;
    }

    /* One block per sub-category */
    .subcat-block {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      margin-bottom: 20px;
      gap: 0;
    }

    .sub-title {
      font-size: 18px;
      font-weight: 700;
      color: #111;
      width: 120px;
      min-width: 120px;
      padding-right: 12px;
      padding-top: 4px;
      line-height: 1.3;
      flex-shrink: 0;
    }

    /* Cards wrap horizontally */
    .cards-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      background: white;
      padding: 10px 14px;
      border-radius: 10px;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.06);
      transition: all 0.18s;
      gap: 2px;
      position: relative;
      cursor: pointer;
      user-select: none;
      width: 160px;
      height: 80px;
      overflow: hidden;
      justify-content: space-between;
    }

    .card:hover {
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      transform: translateY(-2px);
    }

    .card.added {
      box-shadow: 0 0 0 2px #22c55e;
    }




    .toggle-container {
      text-align: center;
      margin-top: 40px;
      margin-bottom: 20px;
    }

    .toggle-btn {
      background: #eee;
      border: 1px solid #ccc;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 13px;
      cursor: pointer;
      color: #555;
      font-weight: 500;
      transition: all 0.2s;
    }

    .toggle-btn:hover {
      background: #e0e0e0;
      color: #000;
    }

    /* Default (EN primary) */
    .card .keyword {
      order: 1;
      font-weight: 600;
      font-size: 14px;
      color: #000;
      word-break: break-word;
    }

    .card .comment {
      order: 2;
      font-size: 11px;
      color: #aaa;
    }

    /* Toggled (CN primary) */
    .card.cn-primary .comment {
      order: 1;
      font-weight: 600;
      font-size: 14px;
      color: #000;
      padding-bottom: 2px;
    }

    .card.cn-primary .keyword {
      order: 2;
      font-weight: 400;
      font-size: 11px;
      color: #aaa;
    }




    /* ── Tooltip ── */
    #mouse-tooltip {
      position: fixed;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 9999;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      display: none;
    }

    /* ── Bottom bar ── */
    #bottom-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 1380px;
      max-width: calc(100% - 40px);
      background: white;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      border-radius: 16px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 200;
    }

    #tags-container {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-height: 100px;
      overflow-y: auto;
      align-items: center;
    }

    .empty-placeholder {
      color: #aaa;
      font-size: 14px;
      font-style: italic;
    }

    .tag-item {
      background: #f2f2f2;
      font-size: 13px;
      padding: 4px 8px 4px 12px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      gap: 5px;
      color: #333;
      border: 1px solid #e0e0e0;
      animation: popIn 0.2s ease-out;
    }

    .tag-comment {
      color: #888;
      font-size: 11px;
    }

    @keyframes popIn {
      0% {
        transform: scale(0.8);
        opacity: 0;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .tag-remove {
      cursor: pointer;
      color: #999;
      font-size: 15px;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: all 0.2s;
    }

    .tag-remove:hover {
      background: #ddd;
      color: #000;
    }

    #copy-tags-btn {
      padding: 10px 20px;
      background-color: #000;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
      font-size: 14px;
      white-space: nowrap;
    }

    #copy-tags-btn:hover:not(.disabled) {
      background-color: #333;
    }

    #copy-tags-btn.disabled {
      background-color: #ccc;
      color: #fff;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  <div id="mouse-tooltip"></div>
  <div id="bottom-bar">
    <div id="tags-container">
      <div class="empty-placeholder">点击关键词以添加</div>
    </div>
    <button id="copy-tags-btn" class="disabled" disabled>复制Prompt</button>
  </div>

  <div id="main-content">
    <header>Bara prompts 💪</header>
    <div class="toggle-container">
      <button id="lang-toggle-btn" class="toggle-btn">切换: 英文为主</button>
    </div>
    <div id="contentArea"></div>
  </div>

  <script src="data.js"></script>
  <script>
    const contentArea = document.getElementById("contentArea");
    const sidebar = document.getElementById("sidebar");

    // ── Permanent delete via localStorage ──
    let deletedKeywords = new Set(JSON.parse(localStorage.getItem('deleted_keywords') || '[]'));


    // ── Render all content ──
    function renderContent() {
      contentArea.innerHTML = '';

      for (let cat in data) {
        const section = document.createElement("section");
        section.className = "cat-section";
        section.id = "cat-" + cat;

        const catTitle = document.createElement("h2");
        catTitle.className = "cat-title";
        catTitle.textContent = cat;
        section.appendChild(catTitle);

        const subs = data[cat];
        for (let sub in subs) {
          const items = subs[sub].filter(item => !deletedKeywords.has(item.keyword));
          if (items.length === 0) continue;

          const subBlock = document.createElement("div");
          subBlock.className = "subcat-block";

          const subTitle = document.createElement("h3");
          subTitle.className = "sub-title";
          subTitle.textContent = sub;
          subBlock.appendChild(subTitle);

          const row = document.createElement("div");
          row.className = "cards-row";

          items.forEach(item => {
            const card = document.createElement("div");
            card.className = "card";
            if (cnPrimary) card.classList.add("cn-primary");
            if (selectedTags.some(t => t.keyword === item.keyword)) card.classList.add('added');
            if (item.remark) card.setAttribute("data-tooltip", item.remark);

            card.onclick = () => {
              const index = selectedTags.findIndex(t => t.keyword === item.keyword);
              if (index === -1) {
                selectedTags.push({ keyword: item.keyword, comment: item.comment });
                card.classList.add('added');
              } else {
                selectedTags.splice(index, 1);
                card.classList.remove('added');
              }
              updateBottomBar();
            };

            const commentEl = document.createElement("div");
            commentEl.className = "comment";
            commentEl.textContent = item.comment;

            const keywordEl = document.createElement("div");
            keywordEl.className = "keyword";
            keywordEl.textContent = item.keyword;

            card.appendChild(commentEl);
            card.appendChild(keywordEl);
            row.appendChild(card);
          });

          subBlock.appendChild(row);
          section.appendChild(subBlock);
        }

        contentArea.appendChild(section);
      }
    }

    // ── Bottom bar ──
    let selectedTags = [];
    const bottomBar = document.getElementById("bottom-bar");
    const tagsContainer = document.getElementById("tags-container");
    const copyTagsBtn = document.getElementById("copy-tags-btn");

    function updateBottomBar() {
      tagsContainer.innerHTML = '';
      if (selectedTags.length > 0) {
        copyTagsBtn.classList.remove("disabled");
        copyTagsBtn.disabled = false;
        selectedTags.forEach((tagObj, index) => {
          const tagEl = document.createElement("div");
          tagEl.className = "tag-item";
          const textSpan = document.createElement("span");
          textSpan.textContent = tagObj.keyword;
          const commentSpan = document.createElement("span");
          commentSpan.className = "tag-comment";
          commentSpan.textContent = `(${tagObj.comment})`;
          const removeBtn = document.createElement("span");
          removeBtn.className = "tag-remove";
          removeBtn.textContent = "×";
          removeBtn.onclick = (e) => {
            e.stopPropagation();
            selectedTags.splice(index, 1);
            // Remove green border from corresponding card if it exists in current view
            contentArea.querySelectorAll('.card.added').forEach(c => {
              if (c.querySelector('.keyword') && c.querySelector('.keyword').textContent === tagObj.keyword) {
                c.classList.remove('added');
              }
            });
            updateBottomBar();
          };
          tagEl.appendChild(textSpan);
          tagEl.appendChild(commentSpan);
          tagEl.appendChild(removeBtn);
          tagsContainer.appendChild(tagEl);
        });
      } else {
        copyTagsBtn.classList.add("disabled");
        copyTagsBtn.disabled = true;
        const placeholder = document.createElement("div");
        placeholder.className = "empty-placeholder";
        placeholder.textContent = "点击关键词以添加";
        tagsContainer.appendChild(placeholder);
      }
    }

    copyTagsBtn.onclick = () => {
      if (selectedTags.length === 0) return;
      const textToCopy = selectedTags.map(t => t.keyword).join(", ");
      navigator.clipboard.writeText(textToCopy).then(() => {
        const orig = copyTagsBtn.textContent;
        copyTagsBtn.textContent = "已复制!";
        setTimeout(() => { copyTagsBtn.textContent = orig; }, 1200);
      });
    };


    // ── Lang Toggle ──
    const toggleBtn = document.getElementById("lang-toggle-btn");
    let cnPrimary = false;
    toggleBtn.onclick = () => {
      cnPrimary = !cnPrimary;
      toggleBtn.textContent = cnPrimary ? "切换: 中文为主" : "切换: 英文为主";
      document.querySelectorAll('.card').forEach(c => {
        c.classList.toggle('cn-primary', cnPrimary);
      });
    };

    // ── Tooltip ──
    const tooltipEl = document.getElementById('mouse-tooltip');
    let tooltipVisible = false;
    document.addEventListener('mouseover', (e) => {
      const card = e.target.closest('.card[data-tooltip]');
      if (card) {
        tooltipEl.textContent = card.getAttribute('data-tooltip');
        tooltipEl.style.display = 'block';
        tooltipVisible = true;
      }
    });
    document.addEventListener('mousemove', (e) => {
      if (tooltipVisible) {
        tooltipEl.style.left = (e.clientX + 15) + 'px';
        tooltipEl.style.top = (e.clientY + 15) + 'px';
      }
    });
    document.addEventListener('mouseout', (e) => {
      const card = e.target.closest('.card[data-tooltip]');
      if (card && (!e.relatedTarget || !card.contains(e.relatedTarget))) {
        tooltipEl.style.display = 'none';
        tooltipVisible = false;
      }
    });

    // ── Init ──
    renderContent();
  </script>
</body>

</html>
